<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 3</title>
        <style>

            body{
                margin : 0;
                display : flex;
                flex-direction : column;

                background-color : white;
            }

            .container{
                width : 36rem;
                height : 32rem;
                display : flex;

            .header{

            .main{

                padding : 1rem;
                color : white;
                border-radius : 0.5rem;
                flex-grow : 1;
                gap : 1rem;
                box-shadow : 0 3px 0 #2f8d59;
            }

            .items{
                display : flex;
                flex-direction : row;
                flex-wrap : wrap;
                margin-top : 1rem;
                gap : 1rem;
                margin-top : 1rem;
            }

            .item{
                background-color : #2f8d59;
                border-radius : 0.5rem;
                padding : 1rem;
                color : white;
                box-shadow : 0 3px 0  #226741;
            }

            .sidebar{
                background-color : #ff6347;
                border-radius : 0.5rem;
                padding : 1rem;
                width : 7rem;
                color : white;
                box-shadow : 0 3px 0 #e02200;
            }

            .footer {
                background-color: #4169e1;
                border-radius: 0.5rem;
                padding: 1rem;
                color: white;
                box-shadow: 0 3px 0 #1d44b8;
            }

        <div class = "container">

                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>

                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>

                    </div>
                </main>
                <div class="sidebar">
                    sidebar
                </div>
            </div>

            <div class="footer">

            </div>

</html>
