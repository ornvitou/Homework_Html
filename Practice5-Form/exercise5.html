<!DOCTYPE>
<html>
  <head>
    <style>

      input[type="checkbox"]{
        width:50px;
        height:20px;
      }
      
      input[type="checkbox"]:checked{
        accent-color: rgb(0, 255, 98);
      }

      input[type="checkbox"]:indeterminate {
        accent-color: orange;
      }

    </style>
  </head>
  <body>

    <p><input type = "checkbox"> Unchecked</p>
    <p><input type = "checkbox" checked> Check!</p>
    <p><input type="checkbox" id="indeterminate">Indeterminate</p>

    <script>
        document.getElementById("indeterminate").indeterminate = true;
    </script>

  </body>
</html>
